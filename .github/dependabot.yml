# Weekly pull requests for outdated or vulnerable dependencies. Only the owner merges them.
# Minor and patch updates come as one pull request per folder; a major update (which can break things) still comes
# on its own so it can be checked by itself.
version: 2
updates:
  - package-ecosystem: npm
    directory: /site
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    groups:
      site-minor-and-patch:
        applies-to: version-updates
        patterns: ['*']
        update-types: [minor, patch]
      site-security:
        applies-to: security-updates
        patterns: ['*']
    ignore:
      # Types follow the Node version CI runs (24 in ci.yml); move both together by hand.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
  - package-ecosystem: npm
    directory: /alerts
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    groups:
      alerts-minor-and-patch:
        applies-to: version-updates
        patterns: ['*']
        update-types: [minor, patch]
      alerts-security:
        applies-to: security-updates
        patterns: ['*']
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    groups:
      actions:
        patterns: ['*']
