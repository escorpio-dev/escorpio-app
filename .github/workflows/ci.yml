name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  site:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - name: Known vulnerabilities in dependencies
        run: npm audit --audit-level=high
      - name: Type check and build
        run: npm run build
      # Desk logic on fixtures plus a live Morpho read, then deposit and borrow against the real contracts with
      # eth_call state overrides (no wallet, no money).
      - name: Desk, deposit and borrow checks
        run: npm test

  alerts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: alerts/package-lock.json
      - run: npm ci
        working-directory: alerts
      - name: Known vulnerabilities in dependencies
        working-directory: alerts
        run: npm audit --audit-level=high
      # Commands, matching, limits, stale guard, holder linking, digest, and the Worker against an in-memory SQLite.
      - name: Alert checks
        working-directory: alerts
        run: node --no-warnings scripts/check-alerts.ts
